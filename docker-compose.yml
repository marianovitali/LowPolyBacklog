services:

  api:
    build:
      context: .
      dockerfile: LowPolyBacklogApi/Dockerfile

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      ApiKey: ${ApiKey}
      AdminPin: ${AdminPin}
      AutoMapper__LicenseKey: ${AutoMapper__LicenseKey}
      CloudinarySettings__CloudName: ${CloudinarySettings__CloudName}
      CloudinarySettings__ApiKey: ${CloudinarySettings__ApiKey}
      CloudinarySettings__ApiSecret: ${CloudinarySettings__ApiSecret}
      IgdbSettings__ClientId: ${IgdbSettings__ClientId}
      IgdbSettings__ClientSecret: ${IgdbSettings__ClientSecret}

  web:
    build:
      context: .
      dockerfile: LowPolyBacklogWeb/Dockerfile

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ApiSettings__BaseUrl: http://api:8080

    depends_on:
      - api