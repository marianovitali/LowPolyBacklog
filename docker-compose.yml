version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: LowPolyBacklogApi/Dockerfile

    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: LowPolyBacklogWeb/Dockerfile

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ApiSettings__BaseUrl: http://api:8080

    depends_on:
      - api